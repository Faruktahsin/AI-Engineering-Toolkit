name: Stale Issue & PR Management

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          stale-issue-message: 'This issue has been automatically marked as stale because it has not had recent activity in 60 days. It will be closed in 14 days if no further activity occurs.'
          stale-pr-message: 'This pull request has been automatically marked as stale because it has not had recent activity in 30 days.'
          days-before-stale: 60
          days-before-pr-stale: 30
          days-before-close: 14
          days-before-pr-close: 14
          exempt-issue-labels: 'pinned,security,frozen-spec'
          exempt-pr-labels: 'pinned,security,frozen-spec'
