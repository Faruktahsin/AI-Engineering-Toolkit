[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aiet-python"
version = "1.0.0"
description = "AI Engineering Toolkit - Python SDK & FastMCP PAKB Integration"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Faruk Tahsin Arik", email = "faruktahsin@gmail.com" }
]
license = { text = "MIT" }
dependencies = [
    "mcp>=1.0.0",
    "pydantic>=2.8.0",
    "tiktoken>=0.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "pyright>=1.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
